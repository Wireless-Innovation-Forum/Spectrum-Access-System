name: Python compatibility

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra scripts
      - name: Build propagation extensions
        run: uv run --locked --extra scripts make -C src/harness/reference_models/propagation PYTHON=python
      - name: Compile Python sources
        run: uv run --locked --extra scripts python -W error::SyntaxWarning -m compileall -q src schema run_unit_tests.py
      - name: Run local unit and TLS integration tests
        run: uv run --locked --extra scripts python run_unit_tests.py -W error
      - name: Validate schema examples
        run: uv run --locked --extra scripts python schema/verify_schema.py
