# Optional environment supplying native GDAL and matching Python bindings.
# conda env create -f conda-environment.yml && conda activate winnf3
# uv sync --locked --active --inexact --no-extra gdal
# uv run --no-sync --active python run_unit_tests.py --with-gdal
# --inexact preserves the conda-installed GDAL bindings; do not enable the pip extra.
name: winnf3
channels:
  - conda-forge
dependencies:
  - python=3.15
  - uv
  - gdal>=3.9
